# ── Cluster identity ─────────────────────────────────────────────────────────
ClusterName=tildecluster
SlurmctldHost=slurmctld

# ── Authentication ────────────────────────────────────────────────────────────
AuthType=auth/munge
CryptoType=crypto/munge

# ── Daemon config ─────────────────────────────────────────────────────────────
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info

# ── Process tracking ──────────────────────────────────────────────────────────
# linuxproc is simpler than cgroup for the daemon; task/cgroup still handles
# per-job CPU pinning via cgroup.conf.
ProctrackType=proctrack/linuxproc
ReturnToService=1
MpiDefault=none
SwitchType=switch/none

# ── Scheduling ────────────────────────────────────────────────────────────────
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# ── Per-job CPU pinning ───────────────────────────────────────────────────────
# task/affinity uses sched_setaffinity() — no cgroup filesystem access needed,
# so the node container runs without privileged mode.
# Memory is capped at the Docker layer (mem_limit in docker-compose.yml).
TaskPlugin=task/affinity

# ── Accounting (disabled Phase 1; swap to slurmdbd for fairshare in Phase 2) ─
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none

# ── Node: your machine, 4 dedicated cores ────────────────────────────────────
# RealMemory is what Slurm advertises; raise it if your Mac has more RAM to offer.
NodeName=node01 CPUs=4 RealMemory=4096 Sockets=1 CoresPerSocket=4 ThreadsPerCore=1 State=UNKNOWN

# ── Partition ─────────────────────────────────────────────────────────────────
PartitionName=tilde Nodes=node01 Default=YES MaxTime=08:00:00 State=UP
